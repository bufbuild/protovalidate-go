syntax = "proto2";

package tests.example.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";

// https://github.com/bufbuild/protovalidate-go/issues/148
message Issue148 {
  optional int32 test = 1 [
    (buf.validate.field).int32.(abs_not_in) = 1,
    (buf.validate.field).int32.(abs_not_in) = -2
  ];
}

// https://github.com/bufbuild/protovalidate-go/issues/187
message Issue187 {
  optional bool false_field = 1 [(buf.validate.field).bool.(this_equals_rule) = false];
  optional bool true_field = 2 [(buf.validate.field).bool.(this_equals_rule) = true];
}

extend buf.validate.Int32Rules {
  repeated int32 abs_not_in = 1800 [(buf.validate.predefined).cel = {
    id: "int32.abs_not_in"
    expression: "this in rule || this in rule.map(n, -n)"
    message: "value must not be in absolute value of list"
  }];
  optional bool gt_or_zero = 1801 [(buf.validate.predefined).cel = {
    id: "int32.gt_or_zero"
    expression: "rule && this != 0 && this <= rules.gt ? 'must be zero or greater than gt' : ''"
  }];
}

extend buf.validate.StringRules {
  optional bool min_len_or_empty = 1800 [(buf.validate.predefined).cel = {
    id: "string.min_len_or_empty"
    expression: "rule && this != '' && uint(size(this)) < rules.min_len ? 'must be empty or at least min_len' : ''"
  }];
}

extend buf.validate.EnumRules {
  repeated int32 enum_forbidden = 1800 [(buf.validate.predefined).cel = {
    id: "enum.forbidden"
    expression: "this in rule ? 'must not be a forbidden value' : ''"
  }];
  optional bool in_or_zero = 1801 [(buf.validate.predefined).cel = {
    id: "enum.in_or_zero"
    expression: "rule && this != 0 && !(this in getField(rules, 'in')) ? 'must be zero or in list' : ''"
  }];
  optional bool const_or_zero = 1802 [(buf.validate.predefined).cel = {
    id: "enum.const_or_zero"
    expression: "rule && this != 0 && this != getField(rules, 'const') ? 'must be zero or const' : ''"
  }];
}

extend buf.validate.BoolRules {
  optional bool this_equals_rule = 1800 [(buf.validate.predefined).cel = {
    id: "bool.this_equals_rule"
    expression: "this == rule ? '' : 'this = %s, rule = %s'.format([string(this), string(rule)])"
  }];
}

// https://github.com/bufbuild/protovalidate-go/issues/296
message Issue296 {
  optional google.protobuf.FieldMask fm = 1 [(buf.validate.field).field_mask.(fm_rules_extension) = {
    paths: ["a"]
  }];
}

extend buf.validate.FieldMaskRules {
  optional google.protobuf.FieldMask fm_rules_extension = 1801 [(buf.validate.predefined).cel = {
    id: "field_mask.fm_rules_extension"
    expression: "this == rule"
  }];
}

enum PredefinedEnum {
  PREDEFINED_ENUM_UNSPECIFIED = 0;
  PREDEFINED_ENUM_ONE = 1;
  PREDEFINED_ENUM_TWO = 2;
}

// Predefined rules that read a sibling standard rule through `rules`.
message PredefinedReadsRules {
  optional int32 gt = 1 [
    (buf.validate.field).int32.gt = 5,
    (buf.validate.field).int32.(gt_or_zero) = true
  ];
  optional string min_len = 2 [
    (buf.validate.field).string.min_len = 3,
    (buf.validate.field).string.(min_len_or_empty) = true
  ];
  optional PredefinedEnum in = 3 [
    (buf.validate.field).enum.in = 1,
    (buf.validate.field).enum.(in_or_zero) = true
  ];
  optional PredefinedEnum const_defined_only = 4 [
    (buf.validate.field).enum.const = 1,
    (buf.validate.field).enum.defined_only = true,
    (buf.validate.field).enum.(const_or_zero) = true
  ];
}
